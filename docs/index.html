<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Awda | عودة – a habit tracker that expects you to slip</title>
<meta name="description" content="Awda is a forgiving habit tracker. No streaks to lose. Miss a day, and it helps you return with a tiny step, not guilt.">
<link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand"><img src="logo.svg" alt="" width="36" height="36"><div><b>Awda <span class="ar">عودة</span></b><small data-i="tag">Built for the days you slip</small></div></div>
<div class="hbtns"><button id="lang" class="ghost">العربية</button></div></header>
<main>
<section id="return" hidden></section>
<section id="today"></section>
<section class="card"><h2 data-i="add">Add a habit</h2>
<form id="form"><input id="name" required maxlength="60" data-ph="phName">
<input id="tiny" maxlength="60" data-ph="phTiny">
<button class="primary" data-i="addBtn">Add</button></form>
<p class="hint" data-i="addHint">Give every habit a tiny version (2 minutes or less). It is what you do on a bad day. It still counts.</p></section>
<section class="card"><h2 data-i="weekly">This month, honestly</h2><div id="stats"></div></section>
<section class="card small"><h2 data-i="data">Your data</h2><p class="hint" data-i="privacy">Everything stays in this browser. No account, no server, no tracking.</p>
<div class="row"><button id="exp" class="ghost" data-i="exp">Export</button><label class="ghost btn"><span data-i="imp">Import</span><input id="imp" type="file" accept=".json" hidden></label><button id="wipe" class="ghost danger" data-i="wipe">Erase all</button></div></section>
</main>
<footer><span data-i="foot">Open source, MIT. Free forever.</span></footer>
<dialog id="sheet"></dialog>
<script src="app.js"></script></body></html>
